apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats-auth-callout
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: nats-auth-callout
  {{- with .Values.deploymentAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: nats-auth-callout
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nats-auth-callout
    spec:
      serviceAccountName: nats-auth-callout
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: responder
          image: {{ include "nats-auth-callout.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: NATS_URL
              value: {{ required "natsURL is required" .Values.natsURL | quote }}
            - name: NATS_ISSUER_SEED
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.issuerSecret.name }}
                  key: {{ .Values.issuerSecret.key }}
            - name: NATS_PROJECT_ACCOUNTS
              value: {{ join "," .Values.projectAccounts | quote }}
            - name: NATS_TOKEN_AUDIENCE
              value: {{ join "," .Values.tokenAudiences | quote }}
          ports:
            - name: health
              containerPort: 8080
              protocol: TCP
          # /readyz exercises the REAL dependency chain: confirmed auth
          # subscription + broker connection + a live TokenReview of
          # the pod's own SA token. A callout that cannot authorize
          # clients goes unready instead of denying everything while
          # looking Running.
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault

apiVersion: v1
kind: ServiceAccount
metadata:
  name: nats-auth-callout
  namespace: {{ .Release.Namespace }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    app.kubernetes.io/name: nats-auth-callout
---
# TokenReview needs the auth-delegator grant (webhook-authenticator
# pattern: the built-in system:auth-delegator ClusterRole).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nats-auth-callout-auth-delegator-{{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: nats-auth-callout
subjects:
  - kind: ServiceAccount
    name: nats-auth-callout
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: system:auth-delegator
  apiGroup: rbac.authorization.k8s.io
